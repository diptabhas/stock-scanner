name: Hourly Stock Scanner

on:
  schedule:
    # Runs at minute 05 of every hour, from 13:05 to 20:05 UTC (Monday through Friday)
    # This translates to 8:05 AM - 3:05 PM CDT, covering your active market session.
    - cron: '5 13-20 * * 1-5'
  workflow_dispatch: # Allows you to manually click a button to test run it anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ema55_alert.py
