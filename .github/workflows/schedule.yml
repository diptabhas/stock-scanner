name: Hourly Stock Scanner

on:
  schedule:
    # Runs at minute 41 of every hour, from 13:29 to 20:29 UTC (Monday through Friday)
    # This translates perfectly to 8:29 AM - 3:29 PM CDT, covering the active trading session.
    - cron: '41 13-20 * * 1-5'
  workflow_dispatch: # Allows you to manually click a button to test run it anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ema55_alert.py
