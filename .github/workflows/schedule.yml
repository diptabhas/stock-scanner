name: Hourly Stock Scanner

on:
  schedule:
    # Runs every hour at minute 0, from 13:00 to 20:00 UTC (9:00 AM - 4:00 PM EST), Monday through Friday
    - cron: '0 13-20 * * 1-5'
  workflow_dispatch: # Allows you to manually click a button to test run it anytime

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scanner Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python ema55_alert.py
