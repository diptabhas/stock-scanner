name: Triple Confluence Screener

on:
  workflow_dispatch:   # cron-job.org triggers this via the GitHub API

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Triple Confluence Screener
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python triple_confluence_screener.py

      - name: Upload results CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triple-confluence-results
          path: triple_confluence.csv
          if-no-files-found: ignore
          retention-days: 14
